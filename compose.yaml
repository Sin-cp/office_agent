name: office-agent

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      OFFICE_AGENT_DATA_DIR: /data
    volumes:
      - type: bind
        source: ${OFFICE_AGENT_HOST_DATA_DIR:-./deploy-data}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${OFFICE_AGENT_BIND_IP:-127.0.0.1}:${OFFICE_AGENT_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
